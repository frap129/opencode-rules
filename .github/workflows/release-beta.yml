name: Release Beta

on:
  push:
    tags: ['v*-beta*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify dev or v2 branch
        run: |
          if ! git branch -r --contains $GITHUB_SHA | grep -Eq 'origin/(dev|v2)'; then
            echo "ERROR: Beta releases must be tagged on the dev or v2 branch"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Verify package contents
        run: bun pm pack --dry-run

      - name: Install npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Publish to npm (next)
        run: npm publish --access public --tag next

      - name: Create GitHub Release
        uses: softprops/action-gh-release@26e8ad27a09a225049a7075d7ec1caa2df6ff332 # v2
        with:
          prerelease: true
          generate_release_notes: true
